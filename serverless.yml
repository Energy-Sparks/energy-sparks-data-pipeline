# For full config options, check the docs:
#    docs.serverless.com

service: data-pipeline
frameworkVersion: '3'
useDotenv: true
configValidationMode: error

plugins:
  - serverless-ruby-layer

custom:
  rubyLayer:
    use_docker: true
    environment:
      # the lambda environment appears quite old as the precompiled nokogiri doesn't work so we need this to force
      # compiling a version in the docker environment
      - BUNDLE_FORCE_RUBY_PLATFORM=true

provider:
  name: aws
  runtime: ruby3.4
  # profile: serverless
  region: eu-west-2
  stage: ${opt:stage, 'development'}
  environment:
    INBOX_BUCKET: es-${self:provider.stage}-data-inbox
    PROCESS_BUCKET: es-${self:provider.stage}-data-process
    COMPRESSED_BUCKET: es-${self:provider.stage}-data-uncompressed
    SPREADSHEET_BUCKET: es-${self:provider.stage}-data-spreadsheet
    AMR_DATA_BUCKET: es-${self:provider.stage}-data-amr-data
    UNPROCESSABLE_BUCKET: es-${self:provider.stage}-data-unprocessable
    SFTP_BUCKET: es-${self:provider.stage}-data-sftp
    ROLLBAR_ACCESS_TOKEN: ${env:ROLLBAR_ACCESS_TOKEN}
    # this allows bundler to pick up git gems in /opt/ruby/3.2.0/bundler from the ruby layer
    BUNDLE_PATH: /opt
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "s3:*"
          Resource:
            - { "Fn::Join" : ["", ["arn:aws:s3:::", { "Ref" : "ServerlessDeploymentBucket" } ]]}
            - "arn:aws:s3:::${self:provider.environment.INBOX_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.PROCESS_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.COMPRESSED_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.SPREADSHEET_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.AMR_DATA_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.UNPROCESSABLE_BUCKET}/*"
            - "arn:aws:s3:::${self:provider.environment.SFTP_BUCKET}/*"
  s3:
    sftpBucket:
      name: ${self:provider.environment.SFTP_BUCKET}
      lifecycleConfiguration:
        Rules:
          - Id: Expires
            Status: Enabled
            ExpirationInDays: 30

package:
  patterns:
    - '!**'
    - 'handlers/*.rb'
    - 'handler.rb'
    - 'Gemfile'
    - 'Gemfile.lock'

functions:
  unpack-attachments:
    handler: handler.DataPipeline::Handler.unpack_attachments
    timeout: 10
    events:
      - s3: ${self:provider.environment.INBOX_BUCKET}
  sftp-copy:
    handler: handler.DataPipeline::Handler.copy
    timeout: 15
    events:
      - s3: sftpBucket
  process-file:
    handler: handler.DataPipeline::Handler.process_file
    events:
      - s3: ${self:provider.environment.PROCESS_BUCKET}
  uncompress:
    handler: handler.DataPipeline::Handler.uncompress_file
    events:
      - s3: ${self:provider.environment.COMPRESSED_BUCKET}
  convert:
    handler: handler.DataPipeline::Handler.convert_file
    timeout: 60
    events:
      - s3: ${self:provider.environment.SPREADSHEET_BUCKET}

resources:
  Resources:
    InboxS3Policy:
      Type: AWS::S3::BucketPolicy
      DependsOn: S3BucketEs${self:provider.stage}datainbox
      Properties:
        Bucket:
          Ref: S3BucketEs${self:provider.stage}datainbox
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: "SESInboxWriter"
              Principal:
                Service: "ses.amazonaws.com"
              Condition:
                StringEquals:
                  "aws:Referer": {Ref: 'AWS::AccountId'}
              Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - arn:aws:s3:::${self:provider.environment.INBOX_BUCKET}/*
    S3BucketAmrData:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.AMR_DATA_BUCKET}
    S3BucketUnprocessable:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.UNPROCESSABLE_BUCKET}
